# Dev stack: Next.js HMR + PostgreSQL ngoài (192.168.0.17). Không chạy production build trong container.
# App: http://localhost:3000
#
# node_modules nằm trong volume Docker (Linux). Sau khi thêm package trên host:
#   make pnpm-sync   hoặc   make pnpm-add PKG=<tên-gói>

services:
  tm_app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    image: tournament_manager:dev
    env_file:
      - .env
    networks:
      - tm
    volumes:
      - .:/app
      - tm_node_modules:/app/node_modules
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://tournament:tournament@192.168.0.17:5432/tournament_manager}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql://tournament:tournament@192.168.0.17:5432/tournament_manager_test}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-to-a-long-random-string}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      RUN_SEED_ON_START: "false"

networks:
  tm:
    driver: bridge

volumes:
  tm_node_modules:
    driver: local
