# Dev stack: Next.js HMR + PostgreSQL. Không chạy production build trong container.
# App: http://localhost:3000
#
# node_modules nằm trong volume Docker (Linux). Sau khi thêm package trên host:
#   make pnpm-sync   hoặc   make pnpm-add PKG=<tên-gói>
# (pnpm install trên host tự chạy postinstall → đồng bộ Docker nếu container đang up)

services:
  tm_app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    image: tournament_manager:dev
    env_file:
      - .env
    networks:
      - tm
    depends_on:
      tm_postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - tm_node_modules:/app/node_modules
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-tournament}:${POSTGRES_PASSWORD:-tournament}@tm_postgres:5432/${POSTGRES_DB:-tournament_manager}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-tournament}:${POSTGRES_PASSWORD:-tournament}@tm_postgres:5432/${POSTGRES_TEST_DB:-tournament_manager_test}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me-to-a-long-random-string}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      RUN_SEED_ON_START: "false"

  tm_postgres:
    image: postgres:16-alpine
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tournament}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tournament}
      POSTGRES_DB: ${POSTGRES_DB:-tournament_manager}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - tm_postgres:/var/lib/postgresql/data
      - ./docker/dev/init-test-db.sh:/docker-entrypoint-initdb.d/01-init-test-db.sh:ro
    networks:
      - tm
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tournament} -d ${POSTGRES_DB:-tournament_manager}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  tm:
    driver: bridge

volumes:
  tm_postgres:
    driver: local
  tm_node_modules:
    driver: local
