services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: /data/tournament-manager.db
      APP_URL: http://localhost:3000
      SESSION_SECRET: docker-dev-only-change-me-long-secret
      RUN_SEED_ON_START: "true"
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: admin123
      SEED_ADMIN_DISPLAY_NAME: Local Admin
    volumes:
      - tm_data:/data
    restart: unless-stopped

volumes:
  tm_data:
